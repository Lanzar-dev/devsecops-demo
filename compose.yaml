# Local development stack: PostgreSQL + one-shot migrator + the API.
# NOTE: the JWT_SECRET below is a clearly-marked LOCAL DEV value only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies committed migrations, then exits. Uses the builder stage (has Prisma CLI).
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://taskuser:devpassword@db:5432/tasks?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      REPOSITORY_DRIVER: prisma
      DATABASE_URL: postgresql://taskuser:devpassword@db:5432/tasks?schema=public
      JWT_SECRET: local-dev-only-change-me-32-characters-min
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
