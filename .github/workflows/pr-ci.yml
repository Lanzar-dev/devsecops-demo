name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image (local)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: devsecops-demo:pr-${{ github.sha }}
          file: ./Dockerfile

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.6.0
        with:
          image-ref: devsecops-demo:pr-${{ github.sha }}
          severity: HIGH,CRITICAL
          scan-type: image
          # Treat unfixed findings as informational in PR CI; CI gate fails only on fixable issues.
          ignore-unfixed: true

  sonarqube:
    name: SonarCloud / SonarQube analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarScanner (wait for quality gate)
        uses: docker://sonarsource/sonar-scanner-cli:latest
        with:
          args: >-
            -Dsonar.host.url=${{ secrets.SONAR_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=lanzar-dev_devsecops-demo
            -Dsonar.projectName=lanzar-dev_devsecops-demo
            -Dsonar.sources=.
            -Dsonar.sources=.
            -Dsonar.verbose=true
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.pullrequest.provider=GitHub
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
